<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miro</title>
<style>
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font:16px system-ui,Arial,sans-serif;color:#334155;background:#fff;text-align:center;padding:24px}
.logo{position:relative;width:132px;height:132px;opacity:0;transform:scale(.85);animation:logoIn .9s ease-out .1s forwards}
.logo img{position:absolute;top:0;left:0;width:132px;height:132px}
.glow{position:absolute;top:-26px;left:-26px;width:184px;height:184px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.55) 0%,rgba(251,146,60,.25) 40%,rgba(251,146,60,0) 68%);animation:pulse 2.8s ease-in-out infinite}
.ring{animation:chakra 14s linear infinite;will-change:transform}
.core{z-index:2}
h1{margin:14px 0 4px;font-size:28px;color:#1e3a8a;opacity:0;animation:fadeUp .8s ease-out .6s forwards}
p{margin:0;color:#64748b;opacity:0;animation:fadeUp .8s ease-out .8s forwards}
@keyframes chakra{to{transform:rotate(360deg)}}
@keyframes logoIn{to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ring,.glow{animation:none}}
</style></head><body>
<div class="logo">
  <div class="glow"></div>
  <img class="ring" src="logo_ring.png" alt="">
  <img class="core" src="logo_core.png" alt="Miro">
</div>
<h1>Miro</h1>
<p>Search or type a web address above.</p>
</body></html>
